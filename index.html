<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compressor de PDF | SEPIEM Consultoria</title>
  <meta name="description" content="Comprima documentos PDF no navegador. SEPIEM Consultoria." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="bar" id="appBar">
    <form id="uploadForm" class="bar-row" novalidate>
      <span class="brand">SEPIEM</span>

      <button type="button" id="dropZone" class="btn" aria-label="Selecionar arquivo PDF">
        <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden />
        <span id="fileLabel">1. Selecionar PDF</span>
      </button>

      <fieldset class="options" id="options" disabled>
        <legend class="visually-hidden">Nível de compressão</legend>
        <label class="btn option">
          <input type="radio" name="quality" value="high" />
          <span>2. Leve</span>
        </label>
        <label class="btn option">
          <input type="radio" name="quality" value="medium" checked />
          <span>2. Equilibrado</span>
        </label>
        <label class="btn option">
          <input type="radio" name="quality" value="low" />
          <span>2. Máximo</span>
        </label>
      </fieldset>

      <button type="submit" id="compressBtn" class="btn btn-action" disabled>
        3. Comprimir
      </button>

      <a id="downloadBtn" class="btn btn-action" href="#" download hidden>4. Baixar</a>
      <button type="button" id="clearFile" class="btn" hidden>Limpar</button>
      <button type="button" id="resetBtn" class="btn" hidden>Novo</button>
    </form>

    <div class="bar-info">
      <p class="instructions">
        PDF no navegador · máx. 50&nbsp;MB · nada é enviado a servidores ·
        Leve = melhor qualidade · Equilibrado = recomendado · Máximo = menor arquivo ·
        Ideal para digitalizados; texto vetorial pode reduzir pouco
      </p>
      <div id="progressPanel" class="progress" hidden>
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="progressLabel">Preparando…</span>
      </div>
      <p id="response" class="status" role="status" aria-live="polite"></p>
      <p id="resultPanel" class="result" hidden>
        <span id="fileMeta"><span id="fileName">—</span> · <span id="fileSize">—</span></span>
        · Original <strong id="statOriginal">—</strong>
        → Comprimido <strong id="statCompressed">—</strong>
        · Redução <strong id="statReduction">—</strong>
      </p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/compressor.js"></script>
</body>
</html>

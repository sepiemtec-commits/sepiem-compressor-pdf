<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compressor de PDF | SEPIEM Consultoria</title>
  <meta name="description" content="Comprima documentos PDF no navegador. SEPIEM Consultoria." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="bar" id="appBar">
    <div class="bar-row">
      <a class="brand" href="https://sepiem.com" target="_blank" rel="noopener noreferrer" aria-label="SEPIEM">
        <img src="img/logo-sepiem.png" alt="SEPIEM" class="brand-logo" />
      </a>

      <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden />

      <button type="button" id="selectBtn" class="btn">
        <span id="fileLabel">1. Selecionar PDF</span>
      </button>

      <button type="button" id="compressBtn" class="btn btn-action" disabled>
        2. Comprimir
      </button>

      <a id="downloadBtn" class="btn btn-action" href="#" download hidden>3. Baixar</a>
      <button type="button" id="resetBtn" class="btn" hidden>Novo</button>
    </div>

    <div class="bar-info">
      <p class="instructions">
        1) Selecione o PDF · 2) Clique em Comprimir · 3) Baixe o arquivo ·
        máx. 50&nbsp;MB · processado no seu navegador (nada é enviado a servidores)
      </p>
      <div id="progressPanel" class="progress" hidden>
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="progressLabel">Preparando…</span>
      </div>
      <p id="response" class="status" role="status" aria-live="polite"></p>
      <p id="resultPanel" class="result" hidden>
        <span id="fileName">—</span> · <span id="fileSize">—</span>
        · Original <strong id="statOriginal">—</strong>
        → Comprimido <strong id="statCompressed">—</strong>
        · Redução <strong id="statReduction">—</strong>
      </p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/compressor.js"></script>
</body>
</html>
